name: Monitor booking availability
run-name: ${{ inputs.send_test_notification && 'Send ntfy test notification' || 'Check booking availability' }}

on:
  # cron-job.org calls this workflow_dispatch endpoint every 2 minutes. Each
  # run performs four checks whose start times are about 30 seconds apart.
  # GitHub's built-in schedule trigger is intentionally omitted to prevent
  # duplicate runs if its scheduler starts working again.
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send an ntfy test notification instead of checking availability"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: booking-availability-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send ntfy test notification
        if: ${{ inputs.send_test_notification }}
        env:
          BOOKING_URL: https://tecomel-traveltotaiwan.youcanbook.me/
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL }}
        run: npm run notify:test

      - name: Restore previous monitor state
        if: ${{ !inputs.send_test_notification }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .state
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=availability-state&per_page=1" --jq '.artifacts[0].id // empty')"
          if [[ -n "$artifact_id" ]]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/availability-state.zip
            unzip -oq /tmp/availability-state.zip -d .state
          else
            echo "No previous state artifact; starting fresh."
          fi

      - name: Check availability and notify
        if: ${{ !inputs.send_test_notification }}
        env:
          BOOKING_URL: https://tecomel-traveltotaiwan.youcanbook.me/
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ vars.NTFY_BASE_URL }}
          NOTIFY_REMINDER_HOURS: "6"
          STATE_FILE: .state/availability.json
          CAPTURE_DISCOVERY: "true"
          DISCOVERY_ARTIFACT_DIR: .artifacts/discovery
          # ubuntu-latest already includes Google Chrome. Using it avoids a
          # 20-30 second Playwright browser installation on every run.
          BROWSER_CHANNEL: chrome
          AUTO_FILL_BOOKING: "true"
          # One-shot safety lock in the state artifact prevents another submit
          # after any click attempt, including an uncertain result.
          AUTO_SUBMIT_BOOKING: "true"
          BOOKING_PROFILE_JSON: ${{ secrets.BOOKING_PROFILE_JSON }}
          CHECK_COUNT: "4"
          CHECK_INTERVAL_SECONDS: "30"
        run: |
          for ((check_number = 1; check_number <= CHECK_COUNT; check_number++)); do
            echo "Starting check ${check_number}/${CHECK_COUNT}..."
            check_started_at="$(date +%s)"

            npm run check

            if jq -e '.bookingSubmission.attemptedAt? != null' \
              .state/availability.json >/dev/null 2>&1; then
              echo "A booking submission is locked; stopping this check loop."
              break
            fi

            if (( check_number < CHECK_COUNT )); then
              check_finished_at="$(date +%s)"
              check_duration=$((check_finished_at - check_started_at))
              sleep_seconds=$((CHECK_INTERVAL_SECONDS - check_duration))

              if (( sleep_seconds > 0 )); then
                echo "Check took ${check_duration}s; waiting ${sleep_seconds}s..."
                sleep "$sleep_seconds"
              else
                echo "Check took ${check_duration}s; starting the next check immediately."
              fi
            fi
          done

      - name: Save monitor state
        if: ${{ always() && !inputs.send_test_notification && hashFiles('.state/availability.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: availability-state
          path: .state/availability.json
          retention-days: 2
          if-no-files-found: error

      - name: Save availability discovery
        if: ${{ always() && !inputs.send_test_notification }}
        uses: actions/upload-artifact@v7
        with:
          name: availability-discovery-${{ github.run_id }}
          path: .artifacts/discovery/
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
